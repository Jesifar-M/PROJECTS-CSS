<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <!--Font Awesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
>

    <style>

        /* Restaurant Name  */
        h3 {
            text-align: right;
            font-family: Arial, sans-serif;
            font-size: 28px;
            color: brown;
        }

        /*Welcome Message */
        p {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 5px;
        }

        /*Table styling*/
        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
            padding: 10px;
        }

        /* Link Styling*/
        a {
            text-decoration: none;
            color: blue;
        }

        a:hover {
            color: red;
        }
    </style>
</head>
<body>

    <h3>
       <i class="fa-solid fa-utensils"></i>
        Delicious Restaurant
        <i class="fa-solid fa-mug-hot"></i> 
    </h3>

    <p>Welcome to Our Restaurant</p>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Burger</td>
            <td>$5</td>
        </tr>
        <tr>
            <td>Pizza</td>
            <td>$8</td>
        </tr>
        <tr>
            <td>Pasta</td>
            <td>$6</td>
        </tr>
    </table>

    <br>

    <center>
        <a href="#">Home |</a>
        <a href="#">View Menu |</a> 
        <a href="#">Contact Us</a>
    </center>

</body>
</html>
