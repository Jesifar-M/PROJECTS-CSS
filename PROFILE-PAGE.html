<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Page</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .name {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .bio {
            background-color: #ffe4b5;
            color: #333;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        .quote {
            background-color: #add8e6;
            color: darkblue;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="name">
        <h1>Jesifar M</h1>
    </div>

    <div class="bio">
        <p>
            Hello! I am Jesifar, a BSc Zoology student currently learning Full Stack Java Development.
            I am interested in technology, web designing, and IT-related jobs.
        </p>
    </div>

    <div class="quote">
        <p>"Success comes to those who work hard and never give up."</p>
    </div>

</body>
</html>
