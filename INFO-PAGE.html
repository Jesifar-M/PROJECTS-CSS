<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact INFO </title>

<style>
h3{
    text-align: right;
    color: darkblue;
    font-family: Arial, sans-serif;
}

.tagline{
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
}

table{
    width: 50%;
    margin: auto;
    border-collapse: collapse;
}

table, th, td{
    border: 1px solid black;
}

th, td{
    text-align: center;
    vertical-align: middle;
    padding: 10px;
}
</style>
</head>
<body>

<h3>ABC Company</h3>

<p class="tagline">Your Trusted Business Partner</p>

<table>
    <tr>
        <th>Department</th>
        <th>Contact Number</th>
    </tr>
    <tr>
        <td>Sales</td>
        <td>9876543210</td>
    </tr>
    <tr>
        <td>Support</td>
        <td>9123456780</td>
    </tr>
</table>

</body>
</html>
