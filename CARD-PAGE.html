<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>

        .product-card {
            /* Width and fixed height */
            width: 300px; 
            height: 400px;
            
            /* Shorthand: width, style, color */
            border: 2px solid #ddd;
            border-radius: 12px;
            
            /* Shorthand: top/bottom, left/right */
            margin: 20px auto;
            
            /* Shorthand: all sides */
            padding: 15px;
            font-family: sans-serif;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .product-image {
            
            max-width: 100%;
            min-width: 200px;
            height: 200px;
            
            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }

        .product-name {
            font-size: 1.25rem;
            margin: 0 0 10px 0;
            color: #333;
        }

        .product-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

    </style>
</head>

<body>

    <div class="product-card">
        <img src="CARD-IMG.png" alt="Product Image" class="product-image">
        <h2 class="product-name">Classic Leather Boots</h2>
        <p class="product-description">
            Women's leather boots are durable, versatile footwear crafted from animal hides.
        </p>
    </div>

</body>
</html>
