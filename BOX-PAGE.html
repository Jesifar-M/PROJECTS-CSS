<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX MODEL</title>

    <style>
        .outer {
            border: 4px solid black;
            padding:20px;
            width: 300px;
        }
        
        .middle {
            border: 3px solid blue;
            padding:15px;
        }

        .inner {
            border: 2px solid red;
            padding: 10px;
            text-align: center;
        } 
    </style>
</head>

<body>
    <div class="outer">
        <div class="middle">
            <div class="inner">
                INNER BOX
            </div>
        </div>
    </div>
</body>

</html>
