<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* First line bold */
p::first-line {
    font-weight: bold;
}

/* First letter red and large */
p::first-letter {
    color: red;
    font-size: 25px;
}

/* Adjacent sibling selector: second h3 green */
h3 + h3 {
    color: green;
}

/* First link red */
ul li:first-child a {
    color: red;
}

/* Normal links */
a:link {
    color: blue;
}

/* Visited links */
a:visited {
    color: purple;
}

/* Hover links */
a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<section>
    <h2>My Section</h2>

    <p>This is the first paragraph. It has some sample text.</p>

    <p>This is the second paragraph. It also has sample text.</p>
</section>

<div>
    <h3>Heading One</h3>
    <h3>Heading Two</h3>
</div>

<div>
    <ul>
        <li><a href="#">First Link</a></li>
        <li><a href="#">Second Link</a></li>
        <li><a href="#">Third Link</a></li>
    </ul>
</div>

</body>
</html>
